# Rebuilds the GitHub Pages site once a day so future-dated posts in _posts/
# go live on their date without needing a push.
name: Daily Pages rebuild

on:
  schedule:
    # 11:00 UTC = 6:00am CDT / 5:00am CST
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
